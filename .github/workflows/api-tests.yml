name: API regression tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      report-ready: ${{ steps.upload-pages.outcome == 'success' }}
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run regression scenarios
        run: mvn -B clean test "-Dcucumber.filter.tags=@regression"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-reports
          path: |
            target/cucumber-report.html
            target/surefire-reports/
          if-no-files-found: warn

      - name: Prepare Cucumber report for GitHub Pages
        id: prepare-pages
        if: ${{ always() && !cancelled() && github.ref == 'refs/heads/master' && github.event_name != 'pull_request' }}
        shell: bash
        run: |
          if [ -s target/cucumber-report.html ]; then
            mkdir -p target/pages
            cp target/cucumber-report.html target/pages/index.html
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "No Cucumber report generated; keeping the existing Pages report."
          fi

      - name: Configure GitHub Pages
        if: ${{ always() && !cancelled() && steps.prepare-pages.outputs.ready == 'true' }}
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages report
        id: upload-pages
        if: ${{ always() && !cancelled() && steps.prepare-pages.outputs.ready == 'true' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/pages

  deploy-report:
    needs: regression
    if: ${{ always() && !cancelled() && needs.regression.outputs.report-ready == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Cucumber report
        id: deployment
        uses: actions/deploy-pages@v4
